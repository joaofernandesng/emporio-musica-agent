[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio"
version = "0.1.0"
description = "Text support agent for Empório da Música"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"emporio.agent" = ["system_prompt.md"]
